{% extends 'analytics/base.html' %}
{% block title %}글 수정 | 커뮤니티{% endblock %}
{% block content %}
<div class="form-shell mx-auto" style="max-width:680px">
  <a href="{% url 'community:post_detail' post.pk %}" class="back-link">← 글로 돌아가기</a>
  <h1 class="h4 mb-4">글 수정</h1>
  <div class="card border-0 shadow-sm"><div class="card-body">
    <form method="post" novalidate>
      {% include 'community/_form_fields.html' %}
      <button class="btn btn-primary w-100" type="submit">수정하기</button>
    </form>
  </div></div>
</div>
{% endblock %}
