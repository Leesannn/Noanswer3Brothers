<form method="get" class="card border-0 shadow-sm mb-4">
  <div class="card-body">
    <div class="row g-3 align-items-end">
      <div class="col-xl-2 col-md-4"><label class="form-label">연도</label><select name="year" class="form-select"><option value="">전체</option>{% for value in years %}<option value="{{ value }}" {% if current.year == value|stringformat:'s' %}selected{% endif %}>{{ value }}</option>{% endfor %}</select></div>
      <div class="col-xl-2 col-md-4"><label class="form-label">지역</label><select name="region" class="form-select"><option value="">전체</option>{% for key,label in region_options %}<option value="{{ key }}" {% if current.region == key %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>
      <div class="col-xl-2 col-md-4"><label class="form-label">종목</label><select name="sport" class="form-select"><option value="">전체</option>{% for key,label in sport_options %}<option value="{{ key }}" {% if current.sport == key %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>
      <div class="col-xl-2 col-md-4"><label class="form-label">기관</label><select name="institution" class="form-select"><option value="">전체</option>{% for item in institutions %}<option value="{{ item.pk }}" {% if current.institution == item.pk|stringformat:'s' %}selected{% endif %}>{{ item.name }}</option>{% endfor %}</select></div>
      <div class="col-xl-2 col-md-4"><label class="form-label">대상</label><select name="target" class="form-select"><option value="">전체</option>{% for value in targets %}<option value="{{ value }}" {% if current.target == value %}selected{% endif %}>{{ value }}</option>{% endfor %}</select></div>
      <div class="col-xl-2 col-md-4"><label class="form-label">프로그램 상태</label><select name="status" class="form-select"><option value="">전체</option>{% for value in statuses %}<option value="{{ value }}" {% if current.status == value %}selected{% endif %}>{{ value }}</option>{% endfor %}</select></div>
      <div class="col-xl-2 col-md-4"><label class="form-label">검색</label><input class="form-control" name="q" value="{{ current.q }}" placeholder="프로그램·종목"></div>
      <div class="col-xl-2 col-md-4 d-flex gap-2"><button class="btn btn-primary flex-fill">적용</button><a class="btn btn-outline-secondary" href="{{ request.path }}">초기화</a></div>
    </div>
  </div>
</form>
