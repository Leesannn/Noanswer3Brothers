{% if page_obj.paginator.num_pages > 1 %}
<nav aria-label="페이지"><ul class="pagination justify-content-center">
  {% if page_obj.has_previous %}<li class="page-item"><a class="page-link" href="{% querystring page=page_obj.previous_page_number %}">이전</a></li>{% endif %}
  <li class="page-item active"><span class="page-link">{{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span></li>
  {% if page_obj.has_next %}<li class="page-item"><a class="page-link" href="{% querystring page=page_obj.next_page_number %}">다음</a></li>{% endif %}
</ul></nav>
{% endif %}
