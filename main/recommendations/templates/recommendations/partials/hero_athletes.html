{% load static %}
<div class="athlete-stage" data-athlete-stage aria-hidden="true">
  <canvas class="trajectory-canvas" data-trajectory-canvas></canvas>

  <div class="athlete-figure-wrap">
    <img class="athlete-figure is-active" data-athlete-image="running" data-enter-from="top"
         src="{% static 'recommendations/images/athletes/web/runner-blue.webp' %}"
         width="900" height="1350" alt="" fetchpriority="high">
    <img class="athlete-figure" data-athlete-image="tennis" data-enter-from="right"
         src="{% static 'recommendations/images/athletes/web/tennis-red.webp' %}"
         width="720" height="1080" alt="" loading="lazy">
    <img class="athlete-figure" data-athlete-image="swimming" data-enter-from="bottom"
         src="{% static 'recommendations/images/athletes/web/swimmer-black.webp' %}"
         width="1000" height="500" alt="" loading="lazy">
    <img class="athlete-figure" data-athlete-image="basketball" data-enter-from="left"
         src="{% static 'recommendations/images/athletes/web/basketball-yellow.webp' %}"
         width="720" height="1080" alt="" loading="lazy">
    <img class="athlete-figure" data-athlete-image="football" data-enter-from="top"
         src="{% static 'recommendations/images/athletes/web/football-black.webp' %}"
         width="720" height="1080" alt="" loading="lazy">
  </div>

  <div class="stage-card card-sport" data-stage-card="sport">
    <img src="{% static 'recommendations/images/athletes/poster-sport.png' %}" width="360" height="450" alt="" loading="lazy">
  </div>
  <div class="stage-card card-region" data-stage-card="region">
    <img src="{% static 'recommendations/images/athletes/poster-region.png' %}" width="360" height="450" alt="" loading="lazy">
  </div>
  <div class="stage-card card-qual" data-stage-card="qual">
    <img src="{% static 'recommendations/images/athletes/poster-qualification.png' %}" width="360" height="450" alt="" loading="lazy">
  </div>
  <div class="stage-card card-org" data-stage-card="org">
    <img src="{% static 'recommendations/images/athletes/poster-institution.png' %}" width="360" height="450" alt="" loading="lazy">
  </div>

  <div class="stage-badge" data-stage-badge>나만의<br>커리어<br>레시피</div>
</div>
