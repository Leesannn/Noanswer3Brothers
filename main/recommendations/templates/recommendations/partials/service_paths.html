{% load static %}
<section class="recommend-split" id="recommend-split" aria-labelledby="split-title">
  <h2 id="split-title" class="sr-only">추천 시작하기</h2>
  <a class="recommend-panel recommend-panel-blue" data-iris-target="unlicensed" href="{% url 'recommendations:unlicensed_recommendation_form' %}">
    <div class="panel-preview" data-panel-preview aria-hidden="true">
      <iframe class="panel-preview-frame" data-iris-frame src="about:blank" data-src="{% url 'recommendations:unlicensed_recommendation_form' %}" tabindex="-1"></iframe>
      <div class="panel-preview-scrim"></div>
      <div class="panel-preview-card">
        <span class="panel-preview-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="5.5"/><path d="M9 13.5 7.5 20 12 17.5 16.5 20 15 13.5"/></svg>
        </span>
        <span class="panel-preview-eyebrow">STEP 01</span>
        <strong>자격증 추천 시작하기</strong>
      </div>
    </div>
    <span class="panel-index">01</span>
    <div>
      <h3>자격증을<br>찾고 있나요?</h3>
      <p>관심 종목과 지역을 바탕으로 활용 가능한 자격 방향을 추천합니다.</p>
    </div>
    <span class="panel-cta">시작하기 <i aria-hidden="true">→</i></span>
  </a>
  <a class="recommend-panel recommend-panel-yellow" data-iris-target="licensed" href="{% url 'recommendations:licensed_recommendation_form' %}">
    <div class="panel-preview" data-panel-preview aria-hidden="true">
      <iframe class="panel-preview-frame" data-iris-frame src="about:blank" data-src="{% url 'recommendations:licensed_recommendation_form' %}" tabindex="-1"></iframe>
      <div class="panel-preview-scrim"></div>
      <div class="panel-preview-card">
        <span class="panel-preview-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21h16"/><path d="M6 21V10l6-5 6 5v11"/><path d="M10 21v-6h4v6"/></svg>
        </span>
        <span class="panel-preview-eyebrow">STEP 02</span>
        <strong>활동 기관 찾아보기</strong>
      </div>
    </div>
    <span class="panel-index">02</span>
    <div>
      <h3>활동할 기관을<br>찾고 있나요?</h3>
      <p>보유 자격을 활용할 수 있는 기관과 프로그램을 연결합니다.</p>
    </div>
    <span class="panel-cta">시작하기 <i aria-hidden="true">→</i></span>
  </a>
</section>

<div class="iris-layer iris-layer-blue" data-iris-layer="unlicensed" aria-hidden="true">
  <iframe class="iris-layer-frame" data-iris-cover-frame src="about:blank" data-src="{% url 'recommendations:unlicensed_recommendation_form' %}" tabindex="-1"></iframe>
  <div class="iris-layer-scrim"></div>
  <div class="iris-layer-brand">
    <div class="iris-layer-brand-row">
      <span class="iris-layer-mark-wrap">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="iris-layer-spinner" aria-hidden="true"></span>
      </span>
      <span class="brand-text"><strong>스포츠 커리어 나침반</strong><small>SPORTS CREATES NEXT CAREERS</small></span>
    </div>
    <div class="iris-layer-collab">
      <img src="{% static 'analytics/images/kspo-logo.png' %}" alt="국민체육진흥공단(KSPO)" class="collab-logo" width="650" height="290">
    </div>
  </div>
</div>
<div class="iris-layer iris-layer-yellow" data-iris-layer="licensed" aria-hidden="true">
  <iframe class="iris-layer-frame" data-iris-cover-frame src="about:blank" data-src="{% url 'recommendations:licensed_recommendation_form' %}" tabindex="-1"></iframe>
  <div class="iris-layer-scrim"></div>
  <div class="iris-layer-brand">
    <div class="iris-layer-brand-row">
      <span class="iris-layer-mark-wrap">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="iris-layer-spinner" aria-hidden="true"></span>
      </span>
      <span class="brand-text"><strong>스포츠 커리어 나침반</strong><small>SPORTS CREATES NEXT CAREERS</small></span>
    </div>
    <div class="iris-layer-collab">
      <img src="{% static 'analytics/images/kspo-logo.png' %}" alt="국민체육진흥공단(KSPO)" class="collab-logo" width="650" height="290">
    </div>
  </div>
</div>
